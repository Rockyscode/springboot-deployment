apiVersion: v1
kind: Service
metadata:
  name: springboot-service
  namespace: demo-app
  labels:
    app: springboot-app
spec:
  # NodePort allows exposing the service on each node's IP at a static port (30000-32767)
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
  selector:
    app: springboot-app
