apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-deployment
  namespace: demo-app
  labels:
    app: springboot-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
        - name: springboot-app
          image: springboot-demo:1.0
          # IfNotPresent ensures Minikube uses the locally built Docker image instead of querying Docker Hub
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # Database host & port from ConfigMap
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: springboot-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: springboot-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: springboot-config
                  key: DB_NAME
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: springboot-config
                  key: SERVER_PORT
            # Sensitive Database credentials from Secret
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          # Readiness Probe: Kubernetes only directs traffic to the Pod once this succeeds
          readinessProbe:
            httpGet:
              path: /api/items/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness Probe: Kubernetes restarts the Pod if this repeatedly fails
          livenessProbe:
            httpGet:
              path: /api/items/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
