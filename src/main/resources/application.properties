# Application Name
spring.application.name=springboot-postgres-k8s

# Server Port (can be overridden via SERVER_PORT environment variable)
server.port=${SERVER_PORT:8080}

# ==============================================================================
# Database Configuration (PostgreSQL)
# Configured with sensible defaults for local development,
# but overridable via environment variables injected by Kubernetes
# ConfigMap (DB_HOST, DB_PORT, DB_NAME) and Secret (DB_USERNAME, DB_PASSWORD)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:itemdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
